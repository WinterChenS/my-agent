      note: MultimodalGuard.apply 的剥离分支。
    - id: A7
      status: implemented-with-evidence
      evidence:
        - MultimodalGuard.validateImages 三道校验（单轮 ≤5 张 / 单张 ≤5MB / 仅
          png,jpeg,webp,gif）。实测：6 张 png + 1 张 bmp → `{"code":400,"msg":"第 7
          张图片格式不支持（仅支持 png/jpeg/webp/gif）：image/bmp；单轮最多发送 5 张图片（当前 7 张）…"}`；单张
          5.5MB → `{"code":400,"msg":"第 1 张图片过大（5MB，上限 5MB）…"}`。单测
          MultimodalGuardLimitsTest 4 条。
      note: 自审时发现最初只做了数量上限，已补齐大小与格式。
    - id: A8
      status: implemented-with-evidence
