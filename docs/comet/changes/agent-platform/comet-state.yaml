  summary:
    text: Phase 12 交付（A53-A72）并包含本轮前后的缺陷修复。①【停止执行】后端新增 RunningRunRegistry（由官方
      AgentResolver / RuntimeContextResolver 在解析时登记「实例 + RuntimeContext」，因为实例按
      (agentDbId, 会话级技能) 缓存，不能重新 build 去中断）与 POST
      /api/sessions/{id}/interrupt（属主校验）→ 调官方
      ReActAgent.interrupt(RuntimeContext)；SSE 的 onCompletion/onError/onTimeout
      在 run 未结束时兜底中断（解决关页面后继续烧 token）；停止标记落进消息
      agui_meta，刷新回放可标注「已停止」。前端生成中把「发送」换成「停止」，点击即 abort 在途 SSE +
      调停止接口，已生成内容保留。②【子 Agent 事件卡】识别官方 subagent.* 事件族并按 source
      聚合成一条可折叠卡片（收起一行／展开看正文与工具行），替代此前「每个 delta 一张未识别 JSON
      卡」的刷屏；该族事件不落库。③【审计时间容错】新增 AuditTimeParser：接受日期（按服务端时区补齐当天起止）、本地日期时间、带偏移
      ISO-8601；非法输入 400（此前只传日期会 500）。④ 另含此前修好的：上传 500（按内容而非只看 MIME
      决定入库）、附件在气泡里可见且模型能感知、框架自管文件不再误入产物。
