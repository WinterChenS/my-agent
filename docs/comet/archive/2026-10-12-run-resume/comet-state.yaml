    text: 输入：发起一轮会持续一段时间的对话，中途断开连接（刷新/关页面）且**不再回来**
    result: passed
    reason:
      text: 实测：启动慢速模型桩+后端，发起 /agui/run 后用 curl --max-time 3 模拟客户端中途断开且不再回来；等待 30s
        后查库，chat_message 出现 ASSISTANT 行（len=108，内容为完整回复），后端日志中无该 threadId 的中断记录。
      truncated: false
  - id: A2
    source: brief.md
    text: 期望：该轮**不被中断**（服务端无中断日志），后端自己跑完并把助手消息落库（`chat_message` 有 ASSISTANT 行） 2.
      接续查询接口
    result: passed
    reason:
      text: 同一实测：断开未触发 interrupt（grep 无中断日志），后端自行跑完并 finish() 落库 ASSISTANT 行，meta 含
        customEvents，答案未丢失。
      truncated: false
