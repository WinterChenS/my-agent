  - id: A2
    source: brief.md
    text: 期望：模型列表/详情显示为已开启；关闭时不可发送图片 2. 图片真正喂给模型
    result: passed
    reason:
      text: 模型列表「采样 / 长度」块内显示「多模态 开/关」；实测关闭状态下带图发送时图片不会被发给模型（见 A6）。
      truncated: false
