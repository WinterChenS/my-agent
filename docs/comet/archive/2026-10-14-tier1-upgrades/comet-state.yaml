    reason:
      text: "容器收到的 #2/#3 请求**不含任何 image**（含图片=False），且文本里带「（注意：用户上传了 N
        张图片，但当前模型不支持图片输入，图片内容没有发给模型，也请不要去读取这些图片文件——二进制内容会撑爆上下文。需要看图请在模型配置里开启多模态\
