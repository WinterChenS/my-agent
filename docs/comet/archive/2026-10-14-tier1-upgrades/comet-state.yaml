        不限」，设置后出现「已超出额度：…」且聊天页出现同等告警条。另修掉一个会漏计的真 bug：额度窗口上界原用应用进程 now()，而
        token_usage.created_at 是数据库 now()，时钟有偏差（实测 DB 快 3 秒）时刚花掉的用量落在窗口外被静默漏计 →
        改为整天/整月开区间。
      truncated: false
