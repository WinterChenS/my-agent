    text: 输入：向已开启多模态的模型发起一轮，附带一张图片
    result: passed
    reason:
      text: 前端把暂存图片转为 AG-UI 内容块 {type:'image', source:{type:'data', value:<base64>,
        mimeType}}；实测向多模态模型发起一轮带图消息返回 RUN_FINISHED。
      truncated: false
  - id: A4
