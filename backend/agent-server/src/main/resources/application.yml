spring:
  application:
    name: agent-server
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # 容器层上限必须 >= 业务上限（myagent.minio.max-file-size-mb，默认 50MB），
      # 否则大文件在进入我们代码之前就被容器拒掉（实测 1.2MB 图片即失败）。
      # 默认比业务上限略高，让"超限"由业务层给出明确提示。
      max-file-size: ${MYAGENT_MULTIPART_MAX_FILE:55MB}
      max-request-size: ${MYAGENT_MULTIPART_MAX_REQUEST:60MB}

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

myagent:
  # HarnessAgent 工作区根目录（运行时状态，已 gitignore）。生产用 MYAGENT_WORKSPACE 指向持久化磁盘。
  workspace-root: ${MYAGENT_WORKSPACE:./.myagent-workspace}
  # 产物对象存储（技术方案 §12.2）。凭据由环境变量注入。
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:agent-platform}
    max-file-size-mb: ${MINIO_MAX_FILE_MB:50}
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
    expire-minutes: 720
  crypto:
    key: ${AGENT_CRYPTO_KEY:dev-only-crypto-key-change-me-0123456789}
