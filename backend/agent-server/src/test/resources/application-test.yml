# 仅 test profile：集成测试专用库 agent_platform_test，跑完由事务回滚。
spring:
  datasource:
    # stringtype=unspecified：允许把 String 写入 jsonb 列（params_json / tool_cache 等）
    url: jdbc:postgresql://localhost:5432/agent_platform_test?stringtype=unspecified
    username: app_user
    password: CHANGE_ME
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      password: CHANGE_ME
      database: 11

logging:
  level:
    com.myagent: info
