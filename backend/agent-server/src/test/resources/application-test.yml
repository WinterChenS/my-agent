# 仅 test profile：集成测试专用库，跑完由事务回滚。
# **不要把真实口令写进这个文件**（它会被提交）；用环境变量提供（见 .env.example）。
spring:
  datasource:
    # stringtype=unspecified：允许把 String 写入 jsonb 列（params_json / tool_cache 等）
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/agent_platform_test?stringtype=unspecified}
    username: ${DB_USERNAME:agent}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change-me}
      database: ${REDIS_TEST_DATABASE:11}

logging:
  level:
    com.myagent: info
