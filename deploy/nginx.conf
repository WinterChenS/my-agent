# my-agent 前端：静态资源 + 反代后端
#
# 两个关键点（踩过就知道疼）：
#  1) SPA 路由（/chat、/admin/...）必须回落到 index.html，否则刷新 404；
#  2) /agui 是 SSE（POST 流式），必须关缓冲、放大超时，否则前端只能"结尾一次性刷出来"甚至直接超时断开。

upstream my_agent_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 产物/附件上传：后端业务上限 50MB，容器 55MB，这里给到 60MB
    client_max_body_size 60m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带 hash 的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 REST
    location /api/ {
        proxy_pass http://my_agent_backend;
        proxy_http_version 1.1;
        # $http_host 带端口（$host 不带）：后端要用它判断"这是同源请求"，
        # 否则 Origin=http://host:18080 与 Host=host 不一致，会被 CORS 判成跨域 → 403
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 浏览器扩展命令通道：WebSocket Upgrade（方案第 12.3 节）
    #  * 必须显式声明 HTTP/1.1 + Upgrade，否则 nginx 会当普通请求，握手直接失败；
    #  * 心跳 20s，读超时必须大于心跳间隔（这里 90s），否则空闲连接被 nginx 掐断；
    #  * proxy_buffering off：命令/结果是小帧、要即时，不能攒着发。
    location = /api/browser/bridge/ws {
        proxy_pass http://my_agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # AG-UI 聊天：SSE 流式，不能缓冲（否则一边想一边看不见）
    location /agui/ {
        proxy_pass http://my_agent_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # 一轮对话可能跑很久（长任务/定时任务触发），给足时间
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查直连后端，方便 compose/运维探活
    location = /healthz {
        proxy_pass http://my_agent_backend/api/health;
        proxy_http_version 1.1;
        # 必须显式给 Host：默认会发 Host: my_agent_backend（带下划线），Tomcat 直接回 400
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA 路由回落
    location / {
        try_files $uri $uri/ /index.html;
    }
}
